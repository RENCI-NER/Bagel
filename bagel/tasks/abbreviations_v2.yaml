# Abbreviation extraction task (prepare stage): prompt template ({text}; literal braces doubled) and output schema.
# Definitions are asked for exactly as written, so they can be checked against the text; nested abbreviations are
# expanded later, by bagel.abbreviations.expand.
name: abbreviations_v2
description: 'abbreviations_v1 plus a rule that a parenthetical naming an instance of the phrase (an example, member, level,
  strain or gene) is not an abbreviation.'
messages:
- role: system
  template: |
    You find the abbreviations that a biomedical text defines.

    An abbreviation is defined when the text introduces a short form for a longer phrase, usually as "long form (SF)", as in "cystic fibrosis (CF)", and sometimes as "SF (long form)".

    Rules:
    1. List every abbreviation the text defines, each with its definition.
    2. Copy the abbreviation and the definition exactly as they appear in the text, with the same spelling, capitalization and spacing.
    3. If a definition contains another abbreviation, copy it as written ("chronic Pa infection (CPA)" gives CPA -> "chronic Pa infection"). Don't expand it.
    4. The definition is only the phrase the short form stands for: "patients with cystic fibrosis (CF)" gives CF -> "cystic fibrosis".
    5. Only list a short form that stands for the phrase itself: one built from its words or initials, or a standard symbol or name for the same thing ("tumor necrosis factor alpha (TNF-α)", "hydrogen peroxide (H2O2)").
    6. A parenthetical that names a particular instance of the phrase is not an abbreviation: an example, a member of a family, a position or level, a strain, or a specific gene. "cervical (C5)", "a potassium channel (KCNA1)" and "inbred mice (BALB/c)" define nothing.
    7. Leave out abbreviations the text uses without defining, and labels such as compound numbers, figure or table numbers, and group names ("compound 3", "group A").

    Respond with only a JSON object in this form:
    {{"abbreviations": [{{"abbreviation": "<short form>", "definition": "<long form>"}}]}}
    Use "abbreviations": [] when the text defines none.
- role: user
  template: "{text}"
output_schema:
  type: object
  properties:
    abbreviations:
      type: array
      items:
        type: object
        properties:
          abbreviation:
            type: string
          definition:
            type: string
        required: [abbreviation, definition]
        additionalProperties: false
  required: [abbreviations]
  additionalProperties: false
