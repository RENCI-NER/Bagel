[project]
name = "bagel"
version = "2.0.0.dev0"
description = "Babel Assisted Generative Entity Linker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.22",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
bagel = "bagel.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bagel"]

[tool.pytest.ini_options]
markers = [
    "integration: calls live services (NameRes, SapBERT, NodeNorm) or a local Ollama",
]
