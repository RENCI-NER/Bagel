prompts:
  - name: "ask_classes"
    version: ""

openai_config:
  llm_model_name: "gpt-4o-2024-05-13"
  organization: ""
  access_key: ""
  llm_model_args: {}

ollama_config:
  llm_model_name: "llama3"
  ollama_base_url: "https://ollama.apps.renci.org"
  llm_model_args: {}

logging_level: DEBUG

langServe: false
# Hosts (fnmatch patterns) that URLs passed in requests (name_res_url, sapbert_url, nodenorm_url, LLM urls) may
# point to. Add the hosts of any other services you use; ["*"] allows any host.
allowed_url_hosts:
  - "*.renci.org"
  - "api.openai.com"
  - "vllm-server*"
  - "ollama*"
  - "localhost"
  - "127.0.0.1"

# Include Python tracebacks in error responses. Debugging only.
return_tracebacks: false
